[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "servicemesh"
version = "0.1.0"
description = "Federated Service Transaction orchestration for cross-company after-sales coordination"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "PyJWT>=2.8",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
    "structlog>=24.1",
    "alembic>=1.13",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
ml = ["scikit-learn>=1.4", "pandas>=2.2", "numpy>=1.26", "joblib>=1.3", "matplotlib>=3.8"]
kafka = ["confluent-kafka>=2.3"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.3", "mypy>=1.9"]

[tool.setuptools.packages.find]
include = ["servicemesh*", "providers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = [
    "e2e: end-to-end scenario tests spanning ServiceMesh and provider services",
    "slow: tests that involve real sleeping/backoff",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["frontend", ".venv", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
exclude = ["frontend/", "build/"]
